name: Torggler Price Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
      - name: Run scraper
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: 587
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          ALARM_THRESHOLD_EUR: ${{ secrets.ALARM_THRESHOLD_EUR }}
          BOARD_TYPE: half_board
          MIN_NIGHTS: 2
          LOOKAHEAD_DAYS: 30
        run: |
          python scraper.py
      - name: Commit DB if changed
        if: github.event_name == 'schedule' || !contains(github.event.head_commit.message, 'Update scan DB')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.db || true
          if git diff --staged --quiet; then
            echo "No DB changes to commit"
          else
            git commit -m "Update scan DB"
            git push
          fi
