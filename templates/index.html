<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preis-Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #f4f7f4;
        --card: #ffffff;
        --line: #dfe7df;
        --text: #1f2a1f;
        --muted: #566456;
        --accent: #2e7d32;
        --accent-soft: #e8f5e9;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 18px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
      }
      .current-price {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 10px 0;
      }
      .current-price span {
        color: var(--accent);
      }
      .meta {
        color: var(--muted);
        line-height: 1.5;
      }
      .last-update {
        margin-top: 10px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .stay-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 14px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .stay-option-label,
      .stay-option-note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .stay-option-price {
        margin-top: 4px;
        font-weight: 700;
      }
      .badge {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .badge.stale {
        background: #fff4e5;
        color: #9a5b00;
      }
      .empty-state {
        color: var(--muted);
        min-height: 120px;
        display: grid;
        place-items: center;
      }
      canvas {
        max-height: 260px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Preis-Monitor</h1>
      <div class="subtitle">Torgglerhof – günstigste Zimmerkategorie inkl. Halbpension</div>

      <div class="card">
        <div id="status" class="badge">Status wird geprüft</div>
        <div id="current">Lade aktuellen Scan…</div>
      </div>

      <div class="card">
        <canvas id="chart" height="120"></canvas>
      </div>
    </div>

    <script>
      async function fetchJson(path) {
        const r = await fetch(path);
        return r.ok ? r.json() : null;
      }

      function formatMoney(value) {
        return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(value);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      async function refresh() {
        const [hist, cur] = await Promise.all([
          fetchJson('/api/history'),
          fetchJson('/api/current')
        ]);

        const labels = hist && hist.history ? hist.history.map(h => new Date(h.ts).toLocaleDateString()) : [];
        const values = hist && hist.history ? hist.history.map(h => h.price) : [];

        const ctx = document.getElementById('chart').getContext('2d');

        if (window.priceChart) {
          window.priceChart.destroy();
        }

        if (!values.length) {
          document.getElementById('chart').replaceWith(Object.assign(document.createElement('div'), {
            className: 'empty-state',
            textContent: 'Noch keine Preisdaten vorhanden.'
          }));
        } else {
          window.priceChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [{
              label: 'Preis pro Nacht (€)',
              data: values,
              borderColor: '#2e7d32',
              backgroundColor: 'rgba(46, 125, 50, 0.15)',
              tension: 0.2,
              fill: true,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { beginAtZero: false }
            }
          }
          });
        }

        if (cur && cur.ok) {
          const s = cur.scan;
          const total = s.nights * s.price;
          const updatedDate = s.ts ? new Date(s.ts) : null;
          const updatedAt = updatedDate ? updatedDate.toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : 'unbekannt';
          const isStale = !updatedDate || Date.now() - updatedDate.getTime() > 28 * 60 * 60 * 1000;
          const status = document.getElementById('status');
          status.textContent = isStale ? 'Veraltete Daten' : 'Aktualisiert';
          status.classList.toggle('stale', isStale);
          const checkIn = new Date(s.start_date);
          const dateAfter = (dateValue, days) => {
            const result = new Date(dateValue);
            result.setDate(result.getDate() + days);
            return result;
          };
          const checkOut = dateAfter(checkIn, s.nights);
          const fmtDate = d => d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
          const followingNightDate = dateAfter(checkIn, 1);
          const renderStayOption = (label, price, nights, offer, room) => `
            <div class="stay-option">
              <div class="stay-option-label">${label}</div>
                  <div class="stay-option-price">${price == null ? 'Kein passendes Angebot' : `${formatMoney(price)}${nights === 1 ? ' / Nacht' : ' gesamt'}`}</div>
              ${price != null && nights > 1 ? `<div class="stay-option-note">${formatMoney(price / nights)} durchschnittlich / Nacht</div>` : ''}
                  ${room ? `<div class="stay-option-note">${escapeHtml(room)}</div>` : ''}
              ${offer ? `<div class="stay-option-note">${escapeHtml(offer)}</div>` : ''}
            </div>
          `;
              const twoNightStart = s.two_night_start ? new Date(s.two_night_start) : null;
              const threeNightStart = s.three_night_start ? new Date(s.three_night_start) : null;
          document.getElementById('current').innerHTML = `
            <div class="current-price"><span>${formatMoney(s.price)}</span> / Nacht inkl. Halbpension</div>
            <div class="meta">
              <strong>${fmtDate(checkIn)} – ${fmtDate(checkOut)}</strong> (${s.nights} Nächte)<br>
              Gesamt: <strong>${formatMoney(total)}</strong><br>
              Zimmer: <em>${escapeHtml(s.room)}</em>
            </div>
            <div class="stay-options">
              ${renderStayOption(`Folgenacht separat (${fmtDate(followingNightDate)})`, s.following_night_price, 1, s.following_night_offer, s.room)}
              ${renderStayOption(twoNightStart ? `Günstigstes Wochenende: 2 Nächte (${fmtDate(twoNightStart)} – ${fmtDate(dateAfter(twoNightStart, 2))})` : 'Kein 2-Nächte-Wochenende gefunden', s.two_night_total, 2, s.two_night_offer, s.two_night_room)}
              ${renderStayOption(threeNightStart ? `Verlängertes Wochenende: 3 Nächte (${fmtDate(threeNightStart)} – ${fmtDate(dateAfter(threeNightStart, 3))})` : 'Kein verlängertes Wochenende gefunden', s.three_night_total, 3, s.three_night_offer, s.three_night_room)}
            </div>
            <div class="last-update">Letztes Update: ${updatedAt}</div>
          `;
        } else {
          document.getElementById('status').textContent = 'Keine Verbindung';
          document.getElementById('status').classList.add('stale');
          document.getElementById('current').innerText = 'Keine Daten';
        }
      }

      refresh().catch(() => {
        document.getElementById('status').textContent = 'Keine Verbindung';
        document.getElementById('status').classList.add('stale');
        document.getElementById('current').innerText = 'Daten konnten nicht geladen werden.';
      });
      setInterval(refresh, 60000);
    </script>
  </body>
</html>
